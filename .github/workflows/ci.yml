name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Pages image)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This is the exact script the Cloudflare Pages build runs.
      # Running it here proves the Pages build works before it is
      # configured on the dashboard: same OS, same toolchain
      # install, same Tailwind CLI, same cargo build.
      - name: Build the site
        run: ./rust/build-pages.sh "$PWD" "$PWD/out-rs"

      # The vendored font assets are the fallback for readers who
      # cannot reach Google Fonts. They must match the Next.js
      # build byte for byte.
      - name: Check the vendored fonts
        run: |
          set -euo pipefail
          cd rust/assets/_next/static
          for f in css/*.css; do
            echo "  $f"
          done
          test "$(ls media/*.woff2 | wc -l)" = "232"

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: pages-output
          path: out-rs
          retention-days: 5
          if-no-files-found: error

  parity:
    name: Parity against the Next.js baseline
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install blog dependencies
        run: npm ci

      # The baseline build must not depend on Google Fonts. Google
      # intermittently answers with extensionless URLs, which crashes
      # the next/font loader (vercel/next.js#99114), so the build
      # failed at random. The mock serves the captured responses from
      # the vendored font files, which makes the build offline and
      # reproducible.
      - name: Build the Next.js baseline
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/rust/ci/font-mock.cjs

      # The mock has to stay in sync with the vendored fonts: if the
      # fonts change, the captured responses are stale and the
      # baseline no longer matches production.
      - name: Check the font mock against the vendored fonts
        run: |
          set -euo pipefail
          test -f rust/ci/font-mock.cjs
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const media = path.join("rust", "assets", "_next", "static", "media");
            const names = fs.readdirSync(media).filter((n) => n.endsWith(".woff2"));
            const mock = fs.readFileSync(path.join("rust", "ci", "font-mock.cjs"), "utf8");
            const missing = names.filter((n) => !mock.includes(n));
            if (missing.length) {
              console.error("the font mock is stale, missing:", missing.length, "files");
              console.error("regenerate it with node scripts/capture-font-mock.mjs");
              process.exit(1);
            }
            if (mock.includes("fonts.gstatic.com")) {
              console.error("the font mock still points at Google");
              process.exit(1);
            }
            console.log("  " + names.length + " vendored fonts, all referenced by the mock");
          '

      - name: Download the Rust build output
        uses: actions/download-artifact@v4
        with:
          name: pages-output
          # The artifact stores the contents of out-rs/, so it has to
          # be unpacked into a directory named out-rs/.
          path: out-rs

      - name: Compare the two output trees
        run: |
          set -euo pipefail
          test -d out-rs
          test -f out-rs/index.html
          python3 rust/scripts/parity.py out out-rs

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # site.css is generated by the build and embedded with
      # `include_str!`, so the crate cannot compile without it. It is
      # regenerated here rather than taken from the artifact, so this
      # job does not need to download the whole site.
      #
      # The build has to run from the rust/ directory: the Tailwind
      # content globs are relative to the working directory, and
      # browserslist looks for its config from there as well. Running
      # it from the repository root scanned the wrong tree and
      # produced a 5 KB stylesheet instead of the real 27 KB one.
      #
      # The browser targets are pinned the same way the build pins
      # them, so the two produce the same stylesheet.
      - name: Build the stylesheet
        working-directory: rust
        env:
          BROWSERSLIST: "chrome >= 111, edge >= 111, firefox >= 111, safari >= 18, ios_saf >= 18, opera >= 97, and_chr >= 111, and_ff >= 111, and_qq >= 12, samsung >= 22"
        run: |
          npx --yes tailwindcss@3.4.19 \
            -i ../src/styles/globals.css \
            -c tailwind.config.js \
            -o site.css \
            --minify

      # The stylesheet has to be the same one the build produces, or
      # the lint job checks a different file than the site serves.
      - name: Check the stylesheet is complete
        run: |
          set -euo pipefail
          test "$(wc -c < rust/site.css)" -gt 20000
          echo "  rust/site.css: $(wc -c < rust/site.css) bytes"

      - name: Format check
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
