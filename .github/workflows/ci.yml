name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Pages image)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # This is the exact script the Cloudflare Pages build runs.
      # Running it here proves the Pages build works before it is
      # configured on the dashboard: same OS, same toolchain
      # install, same Tailwind CLI, same cargo build.
      - name: Build the site
        run: ./rust/build-pages.sh "$PWD" "$PWD/out-rs"

      # The vendored font assets are the fallback for readers who
      # cannot reach Google Fonts. They must match the Next.js
      # build byte for byte.
      - name: Check the vendored fonts
        run: |
          set -euo pipefail
          cd rust/assets/_next/static
          for f in css/*.css; do
            echo "  $f"
          done
          test "$(ls media/*.woff2 | wc -l)" = "232"

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: pages-output
          path: out-rs
          retention-days: 5
          if-no-files-found: error

  parity:
    name: Parity against the Next.js baseline
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install blog dependencies
        run: npm ci

      - name: Build the Next.js baseline
        run: npm run build
        env:
          NODE_ENV: production

      - name: Download the Rust build output
        uses: actions/download-artifact@v4
        with:
          name: pages-output
          # The artifact stores the contents of out-rs/, so it has to
          # be unpacked into a directory named out-rs/.
          path: out-rs

      - name: Compare the two output trees
        run: |
          set -euo pipefail
          test -d out-rs
          test -f out-rs/index.html
          python3 rust/scripts/parity.py out out-rs

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # site.css is generated by the build and embedded with
      # `include_str!`, so the crate cannot compile without it. It is
      # regenerated here rather than taken from the artifact, so this
      # job does not need to download the whole site.
      - name: Build the stylesheet
        run: |
          npx --yes tailwindcss@3.4.19 \
            -i src/styles/globals.css \
            -c rust/tailwind.config.js \
            -o rust/site.css \
            --minify

      - name: Format check
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
